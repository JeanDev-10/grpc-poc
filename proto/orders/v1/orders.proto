syntax = "proto3";

package orders.v1;

service Orders {
  // Unary: reserva stock en Inventory y publica un evento en Notifications.
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
}

message OrderItem {
  string product_id = 1;
  int32 quantity = 2;
}

message CreateOrderRequest {
  repeated OrderItem items = 1;
}

message CreateOrderResponse {
  string order_id = 1;
  bool accepted = 2;
  string reason = 3;
}
